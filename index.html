  <!DOCTYPE html>
  <html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoe Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="./assets/Footwear Collective — Premium Logo.png">
  </head>

  <body>


    <nav class="navbar navbar-expand-lg bg-primary bg-gradient" data-bs-theme="dark">
      <div class="container-fluid">
       <a class="navbar-brand" href="#">
      
            <img src="./assets/Footwear Collective — Premium Logo.png" alt="my picture" class="img-fluid rounded-circle"
              style="width: 50px; height: 50px; object-fit: cover;">
    </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto">
            <div class="d-flex align-items-center">
              <label for="brand" class="form-label ms-2 mb-0 text-light">Brand</label>
              <select id="brand" name="brand" class="form-select ms-2">
                 <option value="all">All</option>
                <option value="adidas">Adidas</option>
                <option value="nike">Nike</option>
                <option value="puma">Puma</option>
                <!-- <option value="reebok">Reebok</option> -->
              </select>
            </div>
            <div class="d-flex align-items-center">
              <label for="color" class="form-label ms-2 mb-0 text-light">Color</label>
              <select id="color" name="color" class="form-select ms-2" >
                <option value="all">All</option>
                <option value="black">Black</option>
                <option value="white">White</option>
                <option value="brown">Brown</option>
              </select>
            </div>
            <div class="d-flex align-items-center">
              <label for="size" class="form-label ms-2 mb-0 text-light">Size</label>
              <select id="size" name="size" class="form-select ms-2">
                <option value="all">All</option>
                <option value="small">Small</option>
                <option value="medium">Medium</option>
                <option value="large">Large</option>
                 <option value="xlarge">X-Large</option>
              </select>
            </div>
           
            <div class="d-flex align-items-center">
              <label for="price" class="form-label ms-2 mb-0 text-light">Price</label>
              <select id="price" name="price" class="form-select ms-2">
                <option value="all">All</option>
                <option value="0-99">.$0 - $99</option>
                <option value="100-199">$100 - $199</option>
                <option value="200-299">$200 - $299</option>
                <option value="300+">$300+</option>
              </select>
            </div>

          </ul>
          <form class="d-flex" role="search">

            <button class="btn btn-outline-light" type="button" onclick="searchProducts()">Search</button>
          </form>
        </div>
      </div>
    </nav>

    <div id="shoe-container" class="container">
      <div class="row px-4 pt-4 ps-4" id="shoe-row">
        <!-- Shoe cards will be dynamically inserted here  -->
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
    <script src="./js/script.js"></script>
  </body>

  </html>
